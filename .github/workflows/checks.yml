name: Static checks

# Derleyici/Unreal gerektirmez: yalniz Python ile veri tablolari ve C++ kaynaginin hafif statik kontrolu.
# Bu bir DERLEME DEGILDIR; yerelde Build.bat + Scripts/RunAllChecks.ps1 hala gereklidir.
on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]  # etiket (protected-paths-ok) degisince yeniden kos

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # PR yol denetimi taban commit'e kadar diff alir
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Veri denetimi (tablolar + spawner/gorev/odul/satici/XP knot oynanabilirligi)
        run: python Scripts/ValidateData.py
      - name: Statik C++ kontrolu (denge, generated.h, RPC/OnRep/override/include kaliplari)
        run: python Scripts/StaticLint.py
      - name: Ilerleme ve ekonomi modelleri calisiyor mu
        run: |
          python Scripts/ProgressionModel.py --max 30 > /dev/null
          python Scripts/EconomyModel.py > /dev/null
          python Scripts/ContentMap.py > /dev/null
      - name: Cep aralik denetimi (komsu cepler >= 1500 u; negatif testiyle)
        run: |
          python Scripts/PocketSpacing.py
          python Scripts/TestPocketSpacing.py
      - name: PlaytestMetrics fixture testi (sahte [MMOMETRIC] logu)
        run: python Scripts/TestPlaytestMetrics.py
      - name: Denetimlerin negatif testleri (kasitli bozuk kopya yakalaniyor mu)
        run: |
          python Scripts/TestStaticLint.py
          python Scripts/TestValidateData.py
      - name: PR korunan yol denetimi (Content/Config/MMOSaveGame.h hata; Party/Trade uyari)
        if: github.event_name == 'pull_request'
        env:
          ALLOW_PROTECTED_PATHS: ${{ contains(github.event.pull_request.labels.*.name, 'protected-paths-ok') && '1' || '0' }}
        run: python Scripts/CheckPrPaths.py ${{ github.event.pull_request.base.sha }}
